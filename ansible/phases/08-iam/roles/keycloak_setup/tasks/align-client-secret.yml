---
# Converge ONE confidential client's secret in Keycloak to the value from
# .testbed.secrets. The realm JSON is imported on first boot only, so a secret
# set (or rotated) in the file after that never reaches Keycloak by itself.
# Idempotent: the PUT runs only when the stored secret differs, so the change
# report stays honest.
#
# Caller passes (via include vars):
#   _align_client_id   the clientId in the realm (e.g. camara-gateway)
#   _align_secret      the desired secret, resolved from .testbed.secrets
#   _align_env_key     the env var name backing it; the align is skipped when
#                      that env var is unset, so a run WITHOUT the sourced
#                      secrets file can never overwrite a real secret with a
#                      changeme-* role default.

- name: "Resolve {{ _align_client_id }} client id (secret align)"
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['workers'][0]]['ansible_host'] }}:{{ keycloak_nodeport }}{{ keycloak_path_prefix }}/admin/realms/{{ keycloak_realm }}/clients?clientId={{ _align_client_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _kc_admin_token.json.access_token }}"
    return_content: true
    status_code: 200
  register: _align_client
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  when: lookup('ansible.builtin.env', _align_env_key) | length > 0

- name: "Read current {{ _align_client_id }} client secret"
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['workers'][0]]['ansible_host'] }}:{{ keycloak_nodeport }}{{ keycloak_path_prefix }}/admin/realms/{{ keycloak_realm }}/clients/{{ _align_client.json[0].id }}/client-secret"
    method: GET
    headers:
      Authorization: "Bearer {{ _kc_admin_token.json.access_token }}"
    return_content: true
    status_code: 200
  register: _align_current
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  when:
    - lookup('ansible.builtin.env', _align_env_key) | length > 0
    - (_align_client.json | default([])) | length > 0

- name: "Align {{ _align_client_id }} client secret with .testbed.secrets"
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['workers'][0]]['ansible_host'] }}:{{ keycloak_nodeport }}{{ keycloak_path_prefix }}/admin/realms/{{ keycloak_realm }}/clients/{{ _align_client.json[0].id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ _kc_admin_token.json.access_token }}"
    body_format: json
    body: "{{ _align_client.json[0] | combine({'secret': _align_secret}) }}"
    status_code: 204
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  when:
    - lookup('ansible.builtin.env', _align_env_key) | length > 0
    - (_align_client.json | default([])) | length > 0
    - _align_current.json.value != _align_secret
